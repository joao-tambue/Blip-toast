    <meta name="theme-color" content="#E8ECEF" />
    <script>
      // Apply the stored or system theme before first paint.
      (function () {
        try {
          var stored = localStorage.getItem('blip-toast-theme');
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E1114');
          }
        } catch (e) {}
      })();
    </script>
